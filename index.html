<style>
:root{--bg:#0c0a0f;--s1:rgba(255,255,255,.04);--s2:rgba(255,255,255,.075);--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.15);--tx:#f4f1ec;--mu:#a7a2ab;--dim:#6d6873;--a:#ff8fb1;--b:#a78bfa;--disp:'Shippori Mincho';--dw:700;
--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.amb i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;filter:blur(110px);opacity:.17;transition:background 1s}
.amb i:first-child{background:var(--a);top:-48vmax;left:-38vmax;animation:dr 24s ease-in-out infinite alternate}
.amb i:last-child{background:var(--b);bottom:-52vmax;right:-42vmax;animation:dr 28s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate(8vmax,6vmax)}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;background-image:var(--noise)}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:16px 20px 44px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
p,h1,h2{margin:0}
.fade{animation:fd .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;height:40px;margin-bottom:6px}
.wm{font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--mu)}
.wm::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));margin-right:10px;vertical-align:2px}
.icn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;color:var(--mu);flex:none}
.scr{display:flex;flex-direction:column;gap:22px}
.center{align-items:center;text-align:center}
.eyebrow,.label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.eyebrow em{font-style:normal;color:var(--dim)}
.label{margin-bottom:12px;display:block}
.display{font-family:var(--disp),serif;font-weight:var(--dw);font-size:clamp(42px,13vw,60px);line-height:1;letter-spacing:-.015em}
.display span{display:block;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
body[data-it="1"] .display span{font-style:italic}
.brand{font-size:clamp(60px,19vw,84px);line-height:.9}
.brand i{font-style:normal;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.edition{font-family:var(--disp),serif;font-weight:var(--dw);font-size:24px;line-height:1.1;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:-4px}
body[data-it="1"] .edition{font-style:italic}
.display.sm{font-size:clamp(34px,10.5vw,46px)}
.h2{font-family:var(--disp),serif;font-weight:var(--dw);font-size:27px;line-height:1.15;letter-spacing:-.01em}
.lede{color:var(--mu);font-size:15px;line-height:1.6}
.lede b{color:var(--tx);font-weight:600}
.hero{display:flex;flex-direction:column;gap:14px;padding:16px 0 2px}
.pair{display:flex}
.pair .av+.av{margin-left:-12px}
.av{width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-block;overflow:hidden;box-shadow:0 0 0 3px var(--bg)}
.av svg{width:100%;height:100%;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--bd);border-radius:99px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap;transition:.2s}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--d)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid var(--bd);border-radius:16px;background:var(--s1)}
.seg button{border-radius:11px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:.2s}
.seg b{font-weight:600;font-size:14px}
.seg span{font-size:12px;color:var(--dim)}
.seg .on{background:var(--s2);box-shadow:inset 0 0 0 1px var(--bd2)}
.seg .on span{color:var(--mu)}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.plh{display:flex;justify-content:space-between;align-items:baseline}
.cn{font-size:12px;color:var(--dim)}
.pl input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--bd2);padding:2px 0 10px;font:inherit;font-size:20px;font-weight:500;color:var(--tx);outline:none;margin-bottom:16px;border-radius:0}
.pl input::placeholder{color:var(--dim)}
.pl input:focus{border-color:var(--a)}
.avs{display:flex;justify-content:space-between;gap:4px}
.avb{border-radius:50%;padding:2px;border:1.5px solid transparent;transition:.2s;opacity:.5}
.avb.on{border-color:var(--a);opacity:1}
.btn{height:56px;border-radius:16px;background:var(--tx);color:var(--bg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.22;pointer-events:none}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd2)}
.how summary{list-style:none;font-weight:600;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:'+';color:var(--mu)}
.how[open] summary::after{content:'–'}
.how ol{margin:14px 0 0;padding-left:18px;color:var(--mu);font-size:14px;line-height:1.65}
.how li{margin-bottom:6px}.how li b{color:var(--tx);font-weight:600}
.foot{text-align:center;font-size:12px;color:var(--dim)}
.hud{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.hrow{display:flex;align-items:center;gap:12px;height:40px}
.hrow .eyebrow{flex:1}
.ps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.ps b{font-family:var(--disp),serif;font-weight:var(--dw);font-size:21px;color:var(--tx);font-variant-numeric:tabular-nums}
.ps .av{box-shadow:0 0 0 1px var(--bd2)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--bd)}
.segs i.d{background:var(--dim)}
.segs i.c{background:linear-gradient(90deg,var(--a),var(--b))}
.num{font-family:var(--disp),serif;font-weight:var(--dw);font-size:132px;line-height:.85;color:transparent;-webkit-text-stroke:1px var(--bd2);margin-top:12px}
.priv{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--bd)}
.scn{margin:0;font-family:var(--disp),serif;font-weight:var(--dw);font-size:25px;line-height:1.28;letter-spacing:-.01em}
.scn::before{content:'“';display:block;font-size:52px;line-height:.55;margin-bottom:6px;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.qhead{display:flex;flex-direction:column;gap:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{position:relative;overflow:hidden;text-align:left;border:1px solid var(--bd);background:var(--s1);border-radius:18px;padding:14px;min-height:122px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:transform .2s,border-color .2s,opacity .3s,background .2s}
.mc .orb{position:absolute;width:120px;height:120px;top:-52px;right:-44px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));filter:blur(24px);opacity:.42;transition:opacity .3s}
.mc .gl{position:absolute;top:14px;left:14px;color:var(--g1)}
.mc .ml{font-family:var(--disp),serif;font-weight:var(--dw);font-size:19px;line-height:1.15;position:relative}
.mc .md{font-size:12px;color:var(--mu);line-height:1.35;position:relative}
.mc.cmp{min-height:88px;padding:12px}
.mc.cmp .ml{font-size:15px}
.mc.cmp .gl{top:12px;left:12px}
.mc.sel,.mc.lit{border-color:color-mix(in srgb,var(--g1) 70%,transparent);background:color-mix(in srgb,var(--g1) 12%,transparent)}
.mc.sel .orb,.mc.lit .orb{opacity:.95}
.mc.lit{transform:scale(1.03)}
.mc.sel::after{content:'';position:absolute;top:13px;right:13px;width:20px;height:20px;border-radius:50%;background:var(--tx) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230c0a0f' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>") center/12px no-repeat}
.mc.wrong{opacity:.2}
.mc.right{border-color:#7ee2a8;background:rgba(126,226,168,.1)}
.sticky{position:sticky;bottom:14px;z-index:3}
.sticky::before{content:'';position:absolute;left:-20px;right:-20px;bottom:-14px;height:100px;background:linear-gradient(transparent,var(--bg) 70%);z-index:-1;pointer-events:none}
.hintbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu)}
.tries{display:flex;gap:5px}.tries i{width:8px;height:8px;border-radius:50%;background:var(--tx);transition:.3s}.tries i.x{background:var(--bd2)}
.hm{position:relative;border-radius:24px;padding:22px;min-height:236px;background:linear-gradient(140deg,var(--g1),var(--g2));color:#120f14;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.hm::before{content:'';position:absolute;inset:0;background-image:var(--noise);opacity:.18;mix-blend-mode:overlay}
.hm .gl{position:absolute;top:20px;left:20px}
.hm .av{position:absolute;top:18px;right:18px;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.hm-l{font-family:var(--disp),serif;font-weight:var(--dw);font-size:40px;line-height:1.02;letter-spacing:-.02em;position:relative}
.hm-d{font-size:14px;opacity:.7;margin-top:6px;position:relative}
.res{display:flex;align-items:center;gap:16px}
.pts{font-family:var(--disp),serif;font-weight:var(--dw);font-size:46px;line-height:1;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.res p{color:var(--mu);font-size:14px;line-height:1.45}
.res p b{color:var(--tx);font-weight:600;display:block}
.talk p:last-child{font-size:15px;line-height:1.55}
.bigpts{font-family:var(--disp),serif;font-weight:var(--dw);font-size:120px;line-height:1;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:36px;padding:0 .05em}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.row>div{display:flex;flex-direction:column;gap:8px}
.pill{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbar{height:2px;background:var(--bd);border-radius:2px;overflow:hidden}
.tbar div{height:100%;width:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s linear}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:3/4;perspective:700px}
.tile .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.tile.flip .in{transform:rotateY(180deg)}
.tile .bk,.tile .fr{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.tile .bk{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 5px,transparent 5px 10px),var(--s1);border:1px solid var(--bd)}
.tile .bk span{width:20px;height:20px;border-radius:50%;border:1px solid var(--bd2);background:radial-gradient(circle,var(--a) 0 2px,transparent 2.5px)}
.tile .fr{transform:rotateY(180deg);background:linear-gradient(140deg,var(--g1),var(--g2));color:#120f14}
.tile .fr .av{position:absolute;bottom:6px;right:6px;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.tile.ok .fr{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.hint{font-size:13px;color:var(--mu);text-align:center}
.track{position:relative;height:64px;border-radius:99px;border:1px solid var(--bd);background:var(--s1);overflow:hidden}
.track::before{content:'';position:absolute;left:4%;right:4%;top:50%;height:1px;background:var(--bd2)}
.zone{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:28%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--a) 24%,transparent),transparent);border-left:1px solid var(--a);border-right:1px solid var(--a);transition:width .4s}
.mk{position:absolute;top:50%;left:4%;width:16px;height:16px;border-radius:50%;background:var(--tx);transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 26px var(--a)}
.tk{position:absolute;top:12px;bottom:12px;width:2px;border-radius:2px;transform:translateX(-50%)}
.msg{text-align:center;font-family:var(--disp),serif;font-weight:var(--dw);font-size:22px;min-height:30px}
.taps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tap{height:184px;border-radius:22px;border:1px solid var(--bd);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:.12s}
.tap b{font-weight:600;font-size:15px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap span{font-size:12px;color:var(--dim)}
.tap>*{pointer-events:none}
.tap.hit{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);transform:scale(.97)}
.ecwrap{display:grid;place-items:center;padding:4px 0}
.eorb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:var(--s1);transition:background .2s,transform .2s,box-shadow .2s;color:#120f14}
.eorb.on{background:linear-gradient(140deg,var(--g1),var(--g2));transform:scale(1.04);box-shadow:0 0 70px color-mix(in srgb,var(--g1) 45%,transparent)}
.dare{border-radius:24px;padding:1px;background:linear-gradient(140deg,var(--a),rgba(255,255,255,.06) 40%,rgba(255,255,255,.06) 60%,var(--b))}
.dare-in{border-radius:23px;background:#141117;padding:26px 22px 20px;display:flex;flex-direction:column;gap:20px}
.dare-in p{font-family:var(--disp),serif;font-weight:var(--dw);font-size:24px;line-height:1.32}
.by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{border:1px solid var(--bd);background:var(--s1);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:600;text-align:center;line-height:1.25;transition:.15s}
.rb:active{border-color:var(--a);background:var(--s2)}
.dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b))}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .hm{min-height:196px;padding:16px}
.duo .hm-l{font-size:24px}
.duo .hm-d{font-size:13px}
.duo .gl{top:16px;left:16px}
.duo .av{top:14px;right:14px}
.ring{width:200px;height:200px}
.scorewrap{position:relative;display:grid;place-items:center;margin:4px 0}
.scorewrap div{position:absolute;text-align:center}
.scorewrap b{display:block;font-family:var(--disp),serif;font-weight:var(--dw);font-size:58px;line-height:1}
.scorewrap span{font-size:11px;color:var(--mu);letter-spacing:.16em;text-transform:uppercase}
.stats{display:flex;flex-direction:column;width:100%;text-align:left}
.stats div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--mu)}
.stats b{color:var(--tx);font-weight:600}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.board .panel{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px}
.board .w{border-color:color-mix(in srgb,var(--a) 60%,transparent);background:color-mix(in srgb,var(--a) 8%,transparent)}
.board b{font-family:var(--disp),serif;font-weight:var(--dw);font-size:50px;line-height:1}
.board span{font-size:13px;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board em{font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--a);font-weight:700}
.btns{display:flex;flex-direction:column;gap:10px;width:100%}
</style>

/* ---------- rounds ---------- */
function desc(t,p){

  case 'memory':return P?`<b>${a}</b> plays. Match all six pairs in 45 seconds — the whole team can help. Finish with 15 seconds left for a bonus.`:`Play together. Match all six pairs in 45 seconds. Finish with 15 seconds left for a bonus.`;
  case 'card':return P?`One player from <b>${a}</b> performs a dare. <b>${b}</b> scores it.`:`<b>${a}</b> performs a dare. <b>${b}</b> scores it.`;

 }
}
function startRound(){

 app.innerHTML=hud()+`<main class="scr fade"><div class="num">${pad(S.round+1)}</div><div class="qhead"><p class="eyebrow">${KIND[r.t]}</p><h1 class="display sm">${ti}</h1><p class="lede">${desc(r.t,r.p)}</p></div><div class="pair">${avs}</div><button class="btn" id="go">Begin <span>→</span></button></main>`;

/* ---- mood reading ---- */
function pickGrid(p,sc,opts,label,cmp,onLock){
 let sel=null;
 app.innerHTML=hud()+`<main class="scr fade"><div class="qhead"><span class="priv">${LOCK} Private · ${isParty()?`one ${nm(p)} player`:nm(p)}</span><p class="eyebrow">${label}</p><blockquote class="scn">${sc}</blockquote></div><div class="mgrid">${opts.map(m=>moodCard(m,cmp)).join('')}</div><div class="sticky"><button class="btn" id="lock" disabled>Lock it in</button></div></main>`;
 app.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{sel=b.dataset.m;app.querySelectorAll('.mc').forEach(x=>x.classList.toggle('sel',x===b));$('#lock').disabled=false;sfx.tap()});
 $('#lock').onclick=()=>{sfx.pop();onLock(sel)};
}
function readRound(p){
 const sc=S.deck.pop(),opts=shuffle(KEYS).slice(0,6);
 pickGrid(p,sc,opts,'Be honest — how would you feel?',false,ans=>passScreen(1-p,()=>guess(p,sc,opts,ans),isParty()?'Huddle up and agree on one answer before you tap.':undefined));
}
function guess(p,sc,opts,ans){
 const g=1-p;let tries=0,done=false;
 const q=isParty()?`${nm(g)} — how would ${nm(p)}'s player feel?`:`${nm(g)} — how does ${nm(p)} feel?`;
 app.innerHTML=hud()+`<main class="scr fade"><div class="qhead"><p class="eyebrow">${q}</p><blockquote class="scn">${sc}</blockquote></div><div class="hintbar"><span id="hint">First guess 3 pts · second guess 1 pt</span><span class="tries"><i id="t1"></i><i id="t2"></i></span></div><div class="mgrid">${shuffle(opts).map(m=>moodCard(m,false)).join('')}</div></main>`;
 app.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
  if(done||b.classList.contains('wrong'))return;tries++;$('#t'+(3-tries)).classList.add('x');
  if(b.dataset.m===ans){done=true;b.classList.add('right');sfx.good();const h=tries===1?3:1;if(tries===1)S.first[g]++;award(g,h);setTimeout(()=>reveal(p,ans,h),700)}
  else{b.classList.add('wrong');sfx.bad();if(tries>=2){done=true;setTimeout(()=>reveal(p,ans,0),700)}else $('#hint').textContent='Not quite — one guess left'}
 });
}
function reveal(p,ans,h){
 const P=isParty(),who=P?`${nm(p)}'s player`:nm(p);
 const line=h===3?'Read perfectly, first try.':h===1?'Got there on the second guess.':'A surprise this time.';
 app.innerHTML=hud()+`<main class="scr fade"><p class="eyebrow">${who} felt</p>${heroMood(ans,ch(p))}<div class="res"><span class="pts">${h?'+'+h:'0'}</span><p><b>${line}</b>${h?(P?`Points to ${nm(1-p)}.`:'Added to your score.'):'No points this round.'}</p></div><div class="panel talk"><span class="label">Talk about it</span><p>${P?`Player, tell the room <i>why</i> you'd feel that way.`:`${nm(p)}, tell ${nm(1-p)} <i>why</i> you'd feel that way.`}</p></div><button class="btn" id="nx">Next round <span>→</span></button></main>`;
 window.scrollTo(0,0);
 $('#nx').onclick=()=>{sfx.pop();nextRound()};
}

/* ---- memory ---- */
function memory(team){
 const set=[0,1].flatMap(p=>shuffle(KEYS).slice(0,3).map(m=>({p,m,k:p+m})));
 const tiles=shuffle([...set,...set]);
 let first=null,lock=false,found=0,left=45,timer=null,started=false,over=false;
 app.innerHTML=hud()+`<main class="scr fade"><div class="row"><div><p class="eyebrow">${clean(T().rounds.memory[1])}${isParty()?` · ${nm(team)}`:''}</p><h2 class="h2">Match the pairs</h2></div><span class="pill" id="tm">45s</span></div><div class="tbar"><div id="tb"></div></div><div class="mem">${tiles.map((t,i)=>`<button class="tile" data-i="${i}"><div class="in"><div class="bk"><span></span></div><div class="fr" style="${gv(t.m)}">${glyph(t.m,30)}${av(ch(t.p),22)}</div></div></button>`).join('')}</div><p class="hint" id="mh">A pair is the same mood <i>and</i> the same person. The clock starts on your first tap.</p></main>`;
 const el=i=>app.querySelector(`.tile[data-i="${i}"]`);
 const tick=()=>{left--;$('#tm').textContent=left+'s';$('#tb').style.width=(left/45*100)+'%';if(left<=10)tone(520,.03,.03);if(left<=0)finish(false)};
 const finish=all=>{if(over)return;over=true;clearInterval(timer);const bonus=all&&left>=15?2:0,h=found+bonus;award(team,h);
  setTimeout(()=>resultScreen(all?'All pairs found':"Time's up",all?`${left} seconds to spare${bonus?' — speed bonus included':''}.`:`${found} of 6 pairs found.`,h,team),700)};
 app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i;if(over||lock||b.classList.contains('flip'))return;
  if(!started){started=true;timer=setInterval(tick,1000);$('#mh').textContent='Go.'}
  b.classList.add('flip');sfx.tap();
  if(first===null){first=i;return}
  const f=first;first=null;
  if(tiles[f].k===tiles[i].k){found++;el(f).classList.add('ok');b.classList.add('ok');sfx.good();if(found===6)finish(true)}
  else{lock=true;setTimeout(()=>{el(f).classList.remove('flip');b.classList.remove('flip');lock=false},750)}
 });
}

/* ---- sync ---- */
function sync(){
 const cs=[ch(0),ch(1)],W=[28,23,19,15,12],D=[1900,1700,1500,1320,1150],P=isParty();
 app.innerHTML=hud()+`<main class="scr fade"><div class="row"><div><p class="eyebrow">${clean(T().rounds.sync[1])}</p><h2 class="h2">Tap inside the zone</h2></div><span class="pill" id="bt">0 / 5</span></div><div class="track" id="trk"><div class="zone" id="zn"></div><div class="mk" id="mk"></div></div><p class="msg" id="msg">${P?'One player per side':'One side each'}</p><div class="taps">${[0,1].map(i=>`<button class="tap" id="t${i}" style="--pc:var(--${i?'b':'a'})">${av(cs[i],64)}<b>${nm(i)}</b><span id="h${i}">0 hits</span></button>`).join('')}</div><button class="btn" id="bg">Start</button></main>`;
 let taps=[null,null],live=false,pos=4,hits=[0,0];
 [0,1].forEach(i=>$('#t'+i).addEventListener('pointerdown',e=>{e.preventDefault();if(!live||taps[i])return;taps[i]={pos,t:performance.now()};$('#t'+i).classList.add('hit');sfx.tap();
  const d=document.createElement('div');d.className='tk';d.style.left=pos+'%';d.style.background=`var(--${i?'b':'a'})`;$('#trk').appendChild(d)}));
 const run=dur=>new Promise(res=>{const st=performance.now(),mk=$('#mk');const f=now=>{const k=Math.min(1,(now-st)/dur);pos=4+k*92;mk.style.left=pos+'%';k<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)});
 $('#bg').onclick=async()=>{
  $('#bg').style.visibility='hidden';
  for(const n of ['3','2','1']){$('#msg').textContent=n;tone(520,.07,.04);await sleep(600)}
  for(let b=0;b<5;b++){
   $('#bt').textContent=`${b+1} / 5`;$('#zn').style.width=W[b]+'%';taps=[null,null];
   app.querySelectorAll('.tk').forEach(x=>x.remove());app.querySelectorAll('.tap').forEach(x=>x.classList.remove('hit'));
   $('#mk').style.left='4%';$('#msg').textContent='Now';await sleep(250);
   live=true;await run(D[b]);live=false;
   const inz=taps.map(t=>!!t&&Math.abs(t.pos-50)<=W[b]/2),n=inz.filter(Boolean).length;
   inz.forEach((ok,i)=>{if(ok){hits[i]++;award(i,1);$('#h'+i).textContent=hits[i]+(hits[i]===1?' hit':' hits')}});
   $('#msg').textContent=n===2&&Math.abs(taps[0].t-taps[1].t)<160?'Perfectly in sync':n===2?'Both inside':n===1?`${nm(inz[0]?0:1)} landed it`:'Missed';
   n?sfx.good():sfx.bad();await sleep(1150);
  }
  const tot=hits[0]+hits[1];
  if(P){const w=hits[0]===hits[1]?-1:hits[0]>hits[1]?0:1;resultScreen(w<0?'Dead heat':`${nm(w)} wins the duel`,`${nm(0)} ${hits[0]}/5 · ${nm(1)} ${hits[1]}/5`,tot)}
  else resultScreen(tot>=8?'Perfectly in sync':tot>=5?'Good rhythm':'A little off-beat',`${tot} of 10 taps landed in the zone.`,tot);
 };
}

/* ---- echo ---- */
function echo(team){
 const pads=['happy','pouty','shy','sleepy'],c=ch(team!==undefined?team:(Math.random()<.5?0:1));
 let seq=[0,1,2].map(()=>Math.random()*4|0),level=0,input=[],accepting=false,got=0;
 app.innerHTML=hud()+`<main class="scr fade"><div class="row"><div><p class="eyebrow">${clean(T().rounds.echo[1])}${isParty()?` · ${nm(team)}`:''}</p><h2 class="h2">Repeat the sequence</h2></div><span class="pill" id="lv">Level 1 / 4</span></div><div class="ecwrap"><div class="eorb" id="ef">${av(c,112)}</div></div><p class="msg" id="msg">Watch, then repeat</p><div class="pads mgrid">${pads.map((m,i)=>moodCard(m,true,`data-i="${i}"`)).join('')}</div><button class="btn" id="bg">Start</button></main>`;
 const pad_=i=>app.querySelector(`.mc[data-i="${i}"]`),ef=$('#ef');
 const flash=async(i,ms)=>{const m=pads[i];ef.style.cssText=gv(m);ef.classList.add('on');ef.innerHTML=glyph(m,68);pad_(i).classList.add('lit');tone(440+i*130,.16);await sleep(ms);pad_(i).classList.remove('lit');ef.classList.remove('on');ef.innerHTML=av(c,112)};
 const play=async()=>{accepting=false;$('#msg').textContent='Watch closely';await sleep(600);const sp=level<2?620:480;for(const i of seq){await flash(i,sp);await sleep(200)}input=[];accepting=true;$('#msg').textContent='Your turn'};
 const finish=()=>{const bonus=level>=4?2:0;award(team,bonus);setTimeout(()=>resultScreen(level>=4?'Flawless recall':got>=2?'Sharp memory':'Tricky one',`Cleared ${got} of 4 levels${bonus?' — perfect-run bonus included':''}.`,got+bonus,team),900)};
 app.querySelectorAll('.pads .mc').forEach(b=>b.onclick=async()=>{
  if(!accepting)return;const i=+b.dataset.i;input.push(i);b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),160);tone(440+i*130,.1);
  if(seq[input.length-1]!==i){accepting=false;sfx.bad();$('#msg').textContent='Wrong mood';return finish()}
  if(input.length===seq.length){accepting=false;got++;level++;award(team,1);sfx.good();
   if(level>=4){$('#msg').textContent='All four levels';return finish()}
   seq.push(Math.random()*4|0);$('#lv').textContent=`Level ${level+1} / 4`;$('#msg').textContent='Correct — one more';await sleep(900);play()}
 });
 $('#bg').onclick=()=>{$('#bg').style.visibility='hidden';play()};
}

/* ---- finale ---- */
function finale(){
 const sc=S.deck.pop(),picks=[null,null],lbl='Pick your own honest mood';
 pickGrid(0,sc,KEYS,lbl,true,m=>{picks[0]=m;passScreen(1,()=>pickGrid(1,sc,KEYS,lbl,true,m2=>{picks[1]=m2;
  app.innerHTML=hud()+`<main class="scr fade center" style="padding-top:28px"><div class="pair">${av(ch(0),72)}${av(ch(1),72)}</div><p class="eyebrow">Both locked in</p><h2 class="h2">Reveal together</h2><p class="lede">${isParty()?'Gather everyone around the screen.':'Sit side by side for this one.'}</p><button class="btn" id="rv">Reveal</button></main>`;
  $('#rv').onclick=()=>finalReveal(sc,picks)}),'Pick <b>your own</b> honest mood — not a guess of theirs.')});
}
function finalReveal(sc,[a,b]){
 const same=a===b,fam=!same&&FAM[a]===FAM[b],h=same?5:fam?2:0;award('both',h);same||fam?sfx.good():sfx.bad();
 const tx=T().same;

/* ---------- end ---------- */
function end(){
 const t=T(),f=S.first;window.scrollTo(0,0);
 const reader=f[0]===f[1]?'Evenly matched mood-readers':`${nm(f[0]>f[1]?0:1)} read moods best`;
 const stats=`<div class="stats"><div><span>${nm(0)} read ${nm(1)} first try</span><b>${f[0]} / 2</b></div><div><span>${nm(1)} read ${nm(0)} first try</span><b>${f[1]} / 2</b></div><div><span>Best reader</span><b>${reader}</b></div></div>`;
 const top=`<header class="top"><span class="wm">Moodle</span><button class="icn" data-mute aria-label="Sound">${spk()}</button></header>`;
 if(isParty()){
  const [a,b]=S.score,w=a===b?-1:a>b?0:1;
  app.innerHTML=top+`<main class="scr fade center" style="padding-top:12px"><p class="eyebrow">${w<0?'Final whistle':'The winner'}</p><h1 class="display sm">${w<0?clean(t.tie):`${nm(w)}<span>${clean(t.win)}</span>`}</h1>
  <div class="board">${[0,1].map(i=>`<div class="panel ${w===i?'w':''}">${w===i?'<em>Winner</em>':'<em style="color:var(--dim)">&nbsp;</em>'}${av(ch(i),64,w<0?'happy':w===i?'excited':'pouty')}<b>${S.score[i]}</b><span>${nm(i)}</span></div>`).join('')}</div>${stats}
  <div class="btns"><button class="btn" id="again">Rematch</button><button class="btn ghost" id="new">Change teams or theme</button></div></main>`;
 }else{
  const h=S.hearts,k=h>=38?0:h>=28?1:h>=18?2:3,[tn,td]=t.tiers[k],R=52,C=2*Math.PI*R;
  const best=+store.get('mr_best_'+TH,0),nb=h>best;if(nb)store.set('mr_best_'+TH,h);
  app.innerHTML=top+`<main class="scr fade center" style="padding-top:12px"><div class="pair">${av(ch(0),56,'love')}${av(ch(1),56,'love')}</div><p class="eyebrow">Your couple type</p><h1 class="display sm"><span>${tn}</span></h1><p class="lede">${td}</p>
  <div class="scorewrap"><svg class="ring" viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient></defs><circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/><circle id="rp" cx="60" cy="60" r="${R}" fill="none" stroke="url(#rg)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)"/></svg><div><b>${h}</b><span>of ${MAX}${nb?' · new best':''}</span></div></div>
  ${stats}<div class="btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="new">Change players or theme</button></div></main>`;
  setTimeout(()=>{const r=$('#rp');if(r)r.style.strokeDashoffset=C*(1-Math.min(1,h/MAX))},120);
 }
 sfx.good();
 $('#again').onclick=()=>{sfx.pop();newGame()};$('#new').onclick=()=>{sfx.pop();title()};
}
title();
</script>
